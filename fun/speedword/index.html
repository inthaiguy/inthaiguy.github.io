<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Speed Word</title>
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="stylesheet" href="typingscoregame.css?v=2">
</head>
<body>

<div class="game-container">
    <div class="top-bar">
        <a href="../" class="back-link">← Links</a>
        <h2>Speed Word</h2>
        <button id="restart" type="button">Restart</button>
    </div>

    <div class="stats">
        <div>
            <span class="label">Score</span>
            <strong id="score">0</strong>
        </div>
        <div>
            <span class="label">Time</span>
            <strong id="time">30</strong>
        </div>
        <div>
            <span class="label">Streak</span>
            <strong id="streak">0</strong>
        </div>
    </div>

    <div class="word-card">
        <span class="label">Type this word</span>
        <div id="target-word">ready</div>
    </div>

    <input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the word and press space">
    <div id="message">Start typing to begin.</div>
</div>

<script src="typingscoregame.js?v=2"></script>

</body>
</html>

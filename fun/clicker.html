<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Clicker Game</title>
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <style>
        /* Basic page styling */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-color: #f4f4f9;
        }

        /* Game container styling */
        .game-container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: min(92vw, 420px);
        }

        .back-link {
            color: #595c8a;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 12px;
            text-decoration: none;
        }

        /* Title styling */
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #333;
        }

        /* Game button styling */
        #click-btn {
            background-color: #4CAF50;
            color: white;
            font-size: 24px;
            font-weight: bold;
            min-height: 90px;
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            touch-action: manipulation;
            user-select: none;
        }

        #click-btn:hover {
            background-color: #45a049;
        }

        /* Score display styling */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .stat {
            background: #f5f7fa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 8px;
        }

        .label {
            color: #666;
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .value {
            color: #333;
            font-size: 24px;
            font-weight: bold;
        }

        /* Timer display styling */
        #status {
            font-size: 18px;
            min-height: 24px;
            margin-top: 14px;
            color: #666;
        }

        #click-btn.running {
            background-color: #2f855a;
        }

        #click-btn.finished {
            background-color: #2d2d56;
        }
    </style>
</head>
<body>

<div class="game-container">
    <a href="./" class="back-link">← Fun</a>
    <h1>Clicker Game</h1>
    <p>Click the button as fast as you can in <span id="time-limit">10</span> seconds!</p>
    <button id="click-btn" type="button">Start clicking!</button>
    <div class="stats">
        <div class="stat">
            <span class="label">Score</span>
            <span id="score" class="value">0</span>
        </div>
        <div class="stat">
            <span class="label">Time</span>
            <span id="timer" class="value">10.0</span>
        </div>
        <div class="stat">
            <span class="label">Best</span>
            <span id="best" class="value">0</span>
        </div>
    </div>
    <div id="status">First click starts and counts.</div>
</div>

<!-- JavaScript directly in the HTML -->
<script>
    let score = 0;
    let bestScore = Number(localStorage.getItem('clickerBestScore') || 0);
    let endTime = 0;
    let gameActive = false;
    let countdown = null;
    const gameLength = 10000;

    const scoreDisplay = document.getElementById('score');
    const timerDisplay = document.getElementById('timer');
    const bestDisplay = document.getElementById('best');
    const clickButton = document.getElementById('click-btn');
    const statusDisplay = document.getElementById('status');

    bestDisplay.textContent = bestScore;

    clickButton.addEventListener('click', () => {
        if (!gameActive) {
            startGame();
        }

        addClick();
    });

    function startGame() {
        gameActive = true;
        score = 0;
        endTime = Date.now() + gameLength;
        scoreDisplay.textContent = score;
        clickButton.textContent = 'Click!';
        clickButton.className = 'running';
        statusDisplay.textContent = 'Go!';
        updateTimer();
        countdown = setInterval(updateTimer, 100);
    }

    function addClick() {
        score++;
        scoreDisplay.textContent = score;
        clickButton.style.transform = 'scale(0.98)';
        setTimeout(() => {
            clickButton.style.transform = '';
        }, 55);
    }

    function updateTimer() {
        const remaining = Math.max(0, endTime - Date.now());
        timerDisplay.textContent = (remaining / 1000).toFixed(1);

        if (remaining <= 0) {
            endGame();
        }
    }

    function endGame() {
        if (!gameActive) {
            return;
        }

        gameActive = false;
        clearInterval(countdown);
        countdown = null;

        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('clickerBestScore', bestScore);
            bestDisplay.textContent = bestScore;
            statusDisplay.textContent = `New best: ${score} clicks!`;
        } else {
            statusDisplay.textContent = `${score} clicks. ${(score / 10).toFixed(1)} clicks/sec.`;
        }

        clickButton.textContent = 'Play again';
        clickButton.className = 'finished';
    }
</script>

</body>
</html>

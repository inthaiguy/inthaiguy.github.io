<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CJB Age Dashboard</title>
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard-grid">
    <div class="clock-container">
        <div class="clock large-font" id="count1">00:00:00</div>
        <div class="descriptor small-font">Since Born</div>
    </div>
    <div class="clock-container">
        <div class="clock large-font" id="count2">00:00:00</div>
        <div class="descriptor small-font">Since USA Move</div>
    </div>
    <div class="clock-container">
        <div class="clock large-font" id="count3">00:00:00</div>
        <div class="descriptor small-font">Til Age 18</div>
    </div>
    <div class="clock-container">
        <div class="clock large-font" id="count4">00:00:00</div>
        <div class="descriptor small-font">Til HS Graduation</div>
    </div>
    <div class="clock-container">
        <div class="clock large-font" id="count5">00:00:00</div>
        <div class="descriptor small-font">Til Age 21</div>
    </div>
    <div class="clock-container">
        <div class="clock large-font" id="count6">00:00:00</div>
        <div class="descriptor small-font">Til Age 30</div>
    </div>
    <div class="clock-container">
        <div class="clock large-font" id="count7">00:00:00</div>
        <div class="descriptor small-font">Til Age 50</div>
    </div>
    <div class="clock-container">
        <div class="clock large-font" id="count8">00:00:00</div>
        <div class="descriptor small-font">Til Year 2100</div>
    </div>
    <div class="clock-container">
        <div class="clock large-font" id="count9">00:00:00</div>
        <div class="descriptor small-font">Til Age 90</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
